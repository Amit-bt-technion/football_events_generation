# Default configuration for Diffusion Transformer
# Copy this file and modify for your experiments

# Paths
paths:
  embeddings_path: "cache/embeddings/embeddings.pkl"
  cache_dir: "cache"
  models_dir: "models"
  output_dir: "outputs"
  autoencoder_path: "models/autoencoder.pt"
  xg_model_path: "models/xg_model.pt"

# Data configuration
data:
  sequence_length: 50
  embedding_dim: 32
  train_split: 0.8
  val_split: 0.1
  num_workers: 4

# Model architecture
model:
  model_dim: 512
  num_layers: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1

# Diffusion process
diffusion:
  num_timesteps: 1000
  noise_schedule: "cosine"  # linear, cosine, quadratic
  beta_start: 0.0001
  beta_end: 0.02

# Training configuration
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_epochs: 5
  save_every: 10
  eval_every: 5
  
# Caching
caching:
  num_cached_samples: 10
  cache_interval: 5

# Evaluation
evaluation:
  num_eval_samples: 1000
  use_statistical_metrics: true
  use_xg_metrics: false
  diversity_weight: 0.5

# Generation
generation:
  num_gen_samples: 100
  ddim_steps: 50

# System
system:
  seed: 42
  device: "cuda"  # cuda or cpu

# Experiment tracking (optional)
experiment:
  name: "diffusion_transformer_default"
  tags: ["baseline", "cosine_schedule"]
  notes: "Default configuration for football event generation"
