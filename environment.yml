name: diffusion
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python & Core
  - python=3.8.12
  - pip
  - nodejs>=12.0

  # Jupyter & Interactive
  - ipython
  - jupyter
  - jupyterlab
  - nbmerge

  # Data Science & Visualization
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - tqdm

  # Image & Video Processing
  - opencv
  - ffmpeg
  - pillow

  # PyTorch Ecosystem
  - pytorch=1.10.1
  - torchvision=0.11.2
  - torchtext
  - cudatoolkit=11.3
  - mkl<2022

  # Testing
  - pytest
  - pytest-xdist

  # Pip-specific packages
  - pip:
    - transformers
    - datasets
    - torchmetrics

platforms:
  - linux-64