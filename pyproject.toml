[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-transformer"
version = "0.2.0"
description = "Experimenting with genAI for football event sequence generation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Amit Ben-=Tzvi", email = "amit-ben@campus.technion.ac.il"},
    {name = "Ilan Zendel", email = "ilan.zendel@campus.technion.ac.il"}
]
maintainers = [
    {name = "Amit Ben-=Tzvi", email = "amit-ben@campus.technion.ac.il"},
    {name = "Ilan Zendel", email = "ilan.zendel@campus.technion.ac.il"}
]
keywords = [
    "diffusion",
    "transformer",
    "unet",
    "deep-learning",
    "football",
    "sports-analytics",
    "event-generation",
    "pytorch",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.62.0",
    "Pillow>=9.0.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.18.0",
]
all = [
    "diffusion-transformer[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/Amit-bt-technion/football_events_generation"
Documentation = "https://github.com/Amit-bt-technion/football_events_generation#readme"
Repository = "https://github.com/Amit-bt-technion/football_events_generation"
"Bug Tracker" = "https://github.com/Amit-bt-technion/football_events_generation/issues"
Changelog = "https://github.com/Amit-bt-technion/football_events_generation/blob/main/CHANGELOG.md"

[project.scripts]
dit-train = "diffusion_transformer.main:main"
dit-generate = "diffusion_transformer.evaluation.generator:main"
dit-evaluate = "diffusion_transformer.evaluation.evaluator:main"
dit-benchmark = "examples.benchmark_models:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffusion_transformer*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
diffusion_transformer = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312", "py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | cache
  | models
  | outputs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["cache/*", "models/*", "outputs/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "matplotlib.*",
    "seaborn.*",
    "scipy.*",
    "sklearn.*",
    "tqdm.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=diffusion_transformer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["diffusion_transformer"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
    "*/cache/*",
    "*/models/*",
    "*/outputs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "cache",
    "models",
    "outputs",
    ".eggs",
    "*.egg",
]
per-file-ignores = [
    "__init__.py:F401",
]

[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]